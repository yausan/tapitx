<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF194" />
      <stop offset="50%" stop-color="#FFD000" />
      <stop offset="100%" stop-color="#FFA800" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70F3FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- TapIt Text -->
  <text x="10" y="48" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="44" fill="url(#goldGrad)" letter-spacing="-1">
    TapIt
  </text>

  <!-- Stylized Trademark X Stroke extending across the 't' (matching the sketch) -->
  <g filter="url(#glow)">
    <!-- Main forward stroke of X -->
    <path d="M 125 55 L 210 15" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" />
    <!-- Diagonal stroke crossing through 't' and forming X (matching the photo sketch) -->
    <path d="M 140 18 L 225 58" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
